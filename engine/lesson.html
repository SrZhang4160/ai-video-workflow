<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/800.css">
<style>
@font-face{font-family:JBM;font-weight:500;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:JBM;font-weight:800;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-800-normal.woff2)}
:root{--bg:#0E1015;--panel:#181B22;--line:#2A2F3A;--ink:#ECEEF3;--quiet:#8B93A3;--acc:#FF8A4C;--acc2:#5BE7C4;--blue:#6EA8FF;--red:#FF6B6B;--yel:#FFD166}
*{margin:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:"Noto Sans SC";color:var(--ink);position:relative;overflow:hidden}
.top{position:absolute;display:flex;align-items:center;gap:18px}
.tag{font-size:26px;font-weight:800;color:var(--bg);background:var(--acc);border-radius:10px;padding:4px 14px;white-space:nowrap}
.ttl{font-size:44px;font-weight:800;line-height:1.15}
.ttl small{display:block;font-size:24px;font-weight:500;color:var(--quiet);margin-top:4px}
#stage{position:absolute;width:960px;height:900px;transform-origin:0 0}
.cap{position:absolute;text-align:center;display:flex;flex-direction:column;justify-content:flex-start}
.cap .a{font-weight:800;line-height:1.3}
.cap .b{font-weight:500;color:var(--quiet);margin-top:10px;line-height:1.3}
/* layout per aspect ratio */
body.r3x4{width:1080px;height:1440px}
body.r3x4 .top{left:64px;right:64px;top:56px}
body.r3x4 #stage{left:60px;top:200px}
body.r3x4 .cap{left:50px;right:50px;top:1140px;height:270px}
body.r9x16{width:1080px;height:1920px}
body.r9x16 .top{left:64px;right:150px;top:220px}
body.r9x16 #stage{left:60px;top:390px;transform:scale(.9)}
body.r9x16 .cap{left:60px;right:150px;top:1235px;height:270px}
body.r4x5{width:1080px;height:1350px}
body.r4x5 .top{left:64px;right:64px;top:44px}
body.r4x5 #stage{left:132px;top:175px;transform:scale(.85)}
body.r4x5 .cap{left:50px;right:50px;top:985px;height:290px}
/* building blocks for scenes */
.mono{font-family:JBM,"Noto Sans SC"}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px}
.r{position:absolute}
.h{font-size:40px;font-weight:800}.s{font-size:28px;color:var(--quiet);font-weight:500}
.chip{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:6px 18px;font-size:28px;margin:6px;color:var(--ink)}
.acc{color:var(--acc)}.ok{color:var(--acc2)}.blue{color:var(--blue)}.red{color:var(--red)}.yel{color:var(--yel)}.q{color:var(--quiet)}
.kw{color:#C792EA}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#6B7385}.nu{color:#F78C6C}.fn{color:#82AAFF}
.center{display:flex;align-items:center;justify-content:center;text-align:center}
</style></head><body>
<div class="top"><span class="tag" id="tag"></span><div class="ttl" id="ttl"></div></div>
<div id="stage"></div>
<div class="cap" id="cap"><div class="a" id="ca"></div><div class="b" id="cb"></div></div>
<script>
const Q = new URLSearchParams(location.search);
const RATIO = Q.get('ratio') || '3x4', LANG = Q.get('lang') || 'zh';
document.body.className = 'r' + RATIO;
const st = document.getElementById('stage');

// ---- helpers available to episode scenes ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// T: pick by language.  B: bilingual label (Chinese + small English) in zh, English only in en.
const T = (zh, en) => LANG === 'zh' ? zh : en;
const B = (zh, en, size) => LANG === 'zh'
  ? `${zh} <span class="s" style="font-size:${size || 26}px">${en}</span>` : en;
// H: add one element to the stage. Each top-level element fades in, in order.
const H = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); const e = d.firstElementChild; st.appendChild(e); return e; };
// code: syntax-highlighted code text (Rust/Python/JS/TS/shell keywords). Comments with // or #.
const KW = new Set('let mut fn if else for in while loop match return struct enum impl trait pub use mod self Self async await move ref const static where type def class import from as with try except raise lambda yield None True False and or not is pass function var new export interface extends'.split(' '));
function code(src) {
  return src.split('\n').map(line => {
    const m = line.match(/^(.*?)(\s(\/\/|#)\s.*|^(\/\/|#)\s.*)?$/); // split trailing comment
    let body = m ? m[1] : line, cm = m && m[2] ? m[2] : '';
    if (/^\s*(\/\/|#)\s/.test(line)) { body = ''; cm = line; }
    body = body.split(/("[^"]*"|'[^']*'|\b\d+(?:\.\d+)?\b|\b[A-Za-z_][A-Za-z0-9_]*\b)/).map(tok => {
      if (!tok) return '';
      if (/^["']/.test(tok)) return `<span class="st">${esc(tok)}</span>`;
      if (/^\d/.test(tok)) return `<span class="nu">${tok}</span>`;
      if (KW.has(tok)) return `<span class="kw">${tok}</span>`;
      if (/^[A-Z][a-z0-9]/.test(tok) || /^(i32|u32|i64|u64|f64|usize|str|bool|int|float|dict|list)$/.test(tok)) return `<span class="ty">${tok}</span>`;
      return esc(tok);
    }).join('').replace(/^( +)/, s => '&nbsp;'.repeat(s.length));
    return `<div>${body}${cm ? `<span class="cm">${esc(cm)}</span>` : ''}</div>`;
  }).join('');
}

// ---- engine API used by render.py ----
const EP = window.EPISODE;
const pick = (c) => Array.isArray(c) ? { zh: c[0], en: c[1] } : c;
window.EP_INFO = () => EP.scenes.map(s => ({
  title: s.title, caps: s.cap.map(pick).map(c => ({ zh: c.zh || '', en: c.en, say_zh: c.say_zh || c.zh || '', say_en: c.say_en || c.en }))
}));
window.showScene = (i) => {
  st.innerHTML = '';
  const s = EP.scenes[i];
  const tag = EP.tag ? T(EP.tag[0], EP.tag[1]) : (LANG === 'zh' ? `第 ${EP.n} 课` : `Lesson ${EP.n}`);
  const tg = document.getElementById('tag'); tg.textContent = tag; tg.style.display = tag ? '' : 'none';
  document.getElementById('ttl').innerHTML = LANG === 'zh' ? `${s.title[0]}<small>${s.title[1]}</small>` : s.title[1];
  s.build();
  return st.children.length;
};

/* ---- timing & motion ----
   Each top-level stage element animates in. Attributes on that element:
     data-cap="k"        appear when caption page k (0-based, this scene) starts; default: spread evenly
     data-delay="0.4"    extra seconds after that
     data-in="fade|up|pop|left|right|zoom|stamp|drop"   entrance style (default up)
     data-move="dx,dy,dur"  after entering, travel by (dx,dy) px over dur s (e.g. a job card sliding into a queue)
     data-shake="1"      shake for 0.5 s after entering (crash, error)
*/
window.FADE = 0.45;
const ease = l => 1 - Math.pow(1 - l, 3);
const back = l => { const c = 1.9; return 1 + (c + 1) * Math.pow(l - 1, 3) + c * Math.pow(l - 1, 2); };
function plan(D, capTimes) {
  const els = [...st.children], N = els.length;
  const gap = Math.min(0.9, 0.7 * D / Math.max(N, 1));
  return els.map((e, i) => {
    const d = e.dataset;
    let t0 = d.cap !== undefined && capTimes && capTimes[+d.cap] !== undefined ? capTimes[+d.cap] + 0.1 : 0.15 + i * gap;
    t0 += +(d.delay || 0);
    let t1 = t0 + window.FADE;
    if (d.move) t1 += +(d.move.split(',')[2] || 0.8);
    if (d.shake) t1 += 0.5;
    return [t0, t1];
  });
}
window.schedule = (D, N, capTimes) => plan(D, capTimes);
window.setFrame = (t, D, capTimes) => {
  const els = [...st.children], P = plan(D, capTimes);
  els.forEach((e, i) => {
    const d = e.dataset;
    if (d.op === undefined) d.op = getComputedStyle(e).opacity;
    if (d.tf === undefined) d.tf = getComputedStyle(e).transform === 'none' ? '' : getComputedStyle(e).transform;
    const t0 = P[i][0], l = Math.min(1, Math.max(0, (t - t0) / window.FADE)), k = ease(l);
    let op = k, tf = '';
    switch (d.in || 'up') {
      case 'fade': break;
      case 'pop': tf = `scale(${0.4 + 0.6 * back(l)})`; break;
      case 'zoom': tf = `scale(${0.85 + 0.15 * k})`; break;
      case 'left': tf = `translateX(${(1 - k) * -140}px)`; break;
      case 'right': tf = `translateX(${(1 - k) * 140}px)`; break;
      case 'drop': tf = `translateY(${(1 - k) * -90}px)`; break;
      case 'stamp': tf = `scale(${1 + 1.2 * (1 - k)}) rotate(${(1 - k) * -18}deg)`; op = Math.min(1, l * 2); break;
      default: tf = `translateY(${(1 - k) * 26}px)`;
    }
    let after = t - t0 - window.FADE;
    if (d.move && after > 0) {
      const [dx, dy, dur] = d.move.split(',').map(Number), m = ease(Math.min(1, after / (dur || 0.8)));
      tf += ` translate(${dx * m}px, ${dy * m}px)`; after -= (dur || 0.8);
    } else if (d.move && after <= 0) { /* not moved yet */ }
    if (d.shake && after > 0 && after < 0.5) tf += ` translateX(${Math.sin(after * 60) * 10 * (1 - after / 0.5)}px)`;
    e.style.opacity = op * (+d.op);
    e.style.transform = (d.tf + ' ' + tf).trim();
  });
};

/* ---- lively building blocks ---- */
const ICONS = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
  cross: '<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
  boom: '<path d="M12 2l2.2 5.6 5.8-2.4-2.6 5.6L22 13l-5.8 1.4 1.6 6-5-3.6L8 20.4l.6-6L2.8 13l5.4-2.2L5.6 5.2l5.6 2.4z" fill="currentColor"/>',
  gear: '<path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.5 4.6v-2.2l-2.3-.5a6.6 6.6 0 0 0-.7-1.6l1.3-2-1.6-1.6-2 1.3a6.6 6.6 0 0 0-1.6-.7L13.1 3.5h-2.2l-.5 2.3a6.6 6.6 0 0 0-1.6.7l-2-1.3-1.6 1.6 1.3 2a6.6 6.6 0 0 0-.7 1.6l-2.3.5v2.2l2.3.5c.2.6.4 1.1.7 1.6l-1.3 2 1.6 1.6 2-1.3c.5.3 1 .5 1.6.7l.5 2.3h2.2l.5-2.3c.6-.2 1.1-.4 1.6-.7l2 1.3 1.6-1.6-1.3-2c.3-.5.5-1 .7-1.6z" fill="currentColor"/>',
  key: '<circle cx="8" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 12h9M18 12v3.5M21 12v2.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
  clock: '<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
  rocket: '<path d="M12 2.5c3.5 2 5 5.8 4.2 10l2.3 3.2-3 1.3-1.2-1.8h-4.6l-1.2 1.8-3-1.3 2.3-3.2C7 8.3 8.5 4.5 12 2.5z" fill="currentColor"/><circle cx="12" cy="9" r="1.8" fill="var(--bg)"/><path d="M10.5 18.5L12 22l1.5-3.5z" fill="var(--acc)"/>',
  box: '<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z M3.5 7.5L12 12l8.5-4.5 M12 12v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  retry: '<path d="M19 8a8 8 0 1 0 1 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M20 3v5.5h-5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
  db: '<ellipse cx="12" cy="6" rx="7.5" ry="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3" fill="none" stroke="currentColor" stroke-width="2.2"/>',
  shield: '<path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>',
  card: '<rect x="2.5" y="5.5" width="19" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M2.5 10h19" stroke="currentColor" stroke-width="2.6"/>',
  user: '<circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5z" fill="currentColor"/>',
};
// icon(name, size px, color css)
const icon = (n, size = 48, color = 'currentColor') =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="color:${color};display:inline-block;vertical-align:middle">${ICONS[n] || ''}</svg>`;
// pill badge, e.g. badge('v2', 'var(--blue)')
const badge = (text, color = 'var(--acc)', size = 26) =>
  `<span style="display:inline-block;font-family:JBM;font-weight:800;font-size:${size}px;color:var(--bg);background:${color};border-radius:10px;padding:2px 12px">${text}</span>`;
// numbered step marker for solutions: num(1)
const num = (n, color = 'var(--acc)') =>
  `<span style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:${color};color:var(--bg);font-weight:900;font-size:32px;font-family:JBM">${n}</span>`;
// small "source" tag for public references, e.g. src('AWS')
const src = (name) => `<span style="font-size:22px;color:var(--quiet);border:1.5px solid var(--line);border-radius:999px;padding:3px 14px">${T('参考', 'from')} · ${name}</span>`;

// caption: zh → Chinese line + English line; en → English line only. Shrinks to fit the caption box.
window.setCap = (c) => {
  const A = document.getElementById('ca'), Bn = document.getElementById('cb'), box = document.getElementById('cap');
  if (!c) { A.textContent = ''; Bn.textContent = ''; return; }
  A.textContent = LANG === 'zh' ? c.zh : c.en; Bn.textContent = LANG === 'zh' ? c.en : '';
  let fa = LANG === 'zh' ? 50 : 46, fb = 31;
  const fit = () => { A.style.fontSize = fa + 'px'; Bn.style.fontSize = fb + 'px'; return box.scrollHeight <= box.clientHeight + 1; };
  while (!fit() && fa > 28) { fa -= 2; fb = Math.max(24, fb - 1); }
};
window.ready = true;
</script></body></html>
